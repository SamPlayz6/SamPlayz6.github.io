name: Deploy to GitHub Pages

# RETIRED 2026-08-25: sdd.ie now serves the full app from Vercel (project sdd-ie).
# 2026-10-01: this workflow now publishes a tiny redirect page so the old
# samplayz6.github.io address forwards to https://sdd.ie instead of 404ing.
# Manual-only (workflow_dispatch), run it once after changing the redirect.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate redirect page
        run: |
          mkdir -p out
          cat > out/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Sam Dunning — moved to sdd.ie</title>
            <meta name="robots" content="noindex">
            <link rel="canonical" href="https://sdd.ie/">
            <meta http-equiv="refresh" content="0; url=https://sdd.ie/">
            <script>window.location.replace("https://sdd.ie/");</script>
          </head>
          <body>
            <p>This site has moved to <a href="https://sdd.ie/">sdd.ie</a>.</p>
          </body>
          </html>
          EOF
          cp out/index.html out/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
